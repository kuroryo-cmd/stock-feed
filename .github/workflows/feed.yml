name: feed

on:
  schedule:
    # 日本時間 平日 12:40・15:45・18:10（GitHubの定期実行は数分〜数十分遅れることがある）
    - cron: "40 3 * * 1-5"
    - cron: "45 6 * * 1-5"
    - cron: "10 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Tokyo
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python build.py
      - name: commit
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "feed $(date '+%Y-%m-%d %H:%M')"
          git push
